<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 悬浮台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="rail">
  <div class="head">
    <span class="grip"></span>
    <span class="hbtns">
      <button class="hbtn pin" id="pin" title="置顶 / 取消置顶">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
          <path d="M12 17v5"/><path d="M6.5 17h11l-1.6-3V6.5a1 1 0 0 0-1-1h-5.8a1 1 0 0 0-1 1V14L6.5 17z"/>
        </svg>
      </button>
      <button class="hbtn gear" id="gear" title="设置">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a1.9 1.9 0 1 1-2.69 2.69l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.47V21a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.9 1.9 0 1 1-2.69-2.69l.06-.06A1.6 1.6 0 0 0 4.6 15a1.6 1.6 0 0 0-1.47-1H3a1.9 1.9 0 1 1 0-3.8h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.9 1.9 0 1 1 2.69-2.69l.06.06A1.6 1.6 0 0 0 9 4.6a1.6 1.6 0 0 0 1-1.47V3a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 1 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.9 1.9 0 1 1 2.69 2.69l-.06.06A1.6 1.6 0 0 0 19.4 9v.1a1.6 1.6 0 0 0 1.47 1H21a1.9 1.9 0 1 1 0 3.8h-.1a1.6 1.6 0 0 0-1.5 1.1z"/>
        </svg>
      </button>
      <button class="hbtn close" id="close" title="退出程序">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </span>
  </div>

  <div class="list" id="list"></div>

  <div class="settings" id="settings" hidden>
    <div class="shead">
      <span>设置</span>
      <button class="sclose" id="settingsClose" title="关闭">×</button>
    </div>
    <div class="srow">
      <span class="slabel">唤出快捷键</span>
      <button class="sbtn" id="hkBtn">未设置</button>
    </div>
    <div class="shint" id="hkHint">
      点上面按钮，然后按下组合键。<br>
      必须含 Ctrl / Alt / Shift；按同一个键可以再收起。
    </div>
  </div>

  <div class="foot">
    <button class="add" id="add" title="选一个文件，自动挂到对应的程序上"><span>＋</span>添加文件</button>
    <div class="tip" id="tip"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
